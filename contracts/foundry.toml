[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Use Monad execution rules (gas pricing, hardforks, precompiles) for tests,
# scripts and simulation. Requires Foundry >= 1.8.0.
network = "monad"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false

# Heavier fuzzing for CI: FOUNDRY_PROFILE=ci forge test
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 200

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad = "https://rpc.monad.xyz"

[fmt]
line_length = 110
